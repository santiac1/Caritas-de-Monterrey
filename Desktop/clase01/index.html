<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Crear cuenta</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <img id="logo" src="assets/tec-logo.png" alt="Tecnológico de Monterrey" />

    <div class="card">
      <h1>Crear cuenta</h1>

      <input type="text" id="firstName" placeholder="Nombre" />
      <br />
      <input type="text" id="lastName" placeholder="Apellido" />
      <br />
      <input type="date" id="dob" />
      <br />
      <input type="text" id="regEmail" placeholder="Email" />
      <br />
      <input type="password" id="regPassword" placeholder="Contraseña" />
      <br />
      <input
        type="password"
        id="regPassword2"
        placeholder="Confirmar contraseña"
      />
      <br />

      <button id="registerButton">Crear cuenta</button>

      <p class="helper">
        ¿Ya tienes cuenta? <a class="link" href="file.html">Login</a>
      </p>
    </div>


    <script src="script.js"></script>
  </body>
</html>
